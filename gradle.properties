# Combat: Better Combat (attack animations, combos, weapon reach) and Combat Roll (dodge roll).
# Both need playerAnimator and Cloth Config. Our weapons only use Better Combat's data files, so it is runtime only;
# Combat Roll is compiled against for its roll event, attributes and key binding.
better_combat_version=2.4.0+1.21.1-neoforge
combat_roll_version=2.0.6+1.21.1-neoforge
playeranimator_version=2.0.4+1.21.1-forge
cloth_config_version=15.0.140+neoforge
# Compile-only integrations (plugins come later)
jei_version=19.70.0.469
jade_version=15.10.6+neoforge
