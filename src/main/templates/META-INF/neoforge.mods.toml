modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

# How skill blows land: the struck creature's white flash, hitstop and shudder (client only, see com.beyondsolo.mixin)
[[mixins]]
config="beyondsolo.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.7,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[9.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="apothic_attributes"
    type="required"
    versionRange="[2.0,)"
    ordering="NONE"
    side="BOTH"

# Lifts vanilla's attribute caps (max health 1024, damage 2048): the System's health pools and blows go well past them.
[[dependencies.${mod_id}]]
    modId="attributefix"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

# Combat: attack animations and combos (weapons use its data files), and the dodge roll.
[[dependencies.${mod_id}]]
    modId="bettercombat"
    type="required"
    versionRange="[2.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="combat_roll"
    type="required"
    versionRange="[2.0,)"
    ordering="NONE"
    side="BOTH"
